name: 로또 데이터 자동 업데이트

on:
  schedule:
    # 매주 토요일 21:00 KST (12:00 UTC)
    - cron: '0 12 * * 6'
  workflow_dispatch:  # 수동 실행 가능

jobs:
  update-data:
    runs-on: ubuntu-latest
    
    steps:
    - name: 저장소 체크아웃
      uses: actions/checkout@v3
    
    - name: Python 설정
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: 의존성 설치
      run: |
        pip install requests
    
    - name: 로또 데이터 업데이트
      run: |
        python update_lotto_data.py
    
    - name: 변경사항 커밋 및 푸시
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        git add lotto_data.json
        git diff --quiet && git diff --staged --quiet || (git commit -m "자동 업데이트: 로또 데이터 $(date +'%Y-%m-%d')" && git push)
